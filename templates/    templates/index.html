<!DOCTYPE html>
<html dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;background:#000;font-family:Arial;overflow:hidden}
.header{position:fixed;top:0;width:100%;z-index:10;background:#0009;display:flex;gap:5px;padding:10px}
.header input{flex:1;padding:10px;border-radius:20px;border:none}
.header button{padding:10px 15px;border-radius:20px;border:none;background:#1877f2;color:#fff}
.reel{height:100vh;width:100vw;position:relative;scroll-snap-align:start}
video{height:100%;width:100%;object-fit:cover}
.info{position:absolute;bottom:90px;left:15px;right:70px;color:#fff;text-shadow:1px 1px 2px #000}
.actions{position:absolute;right:15px;bottom:130px;color:#fff;font-size:26px;text-align:center}
.container{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}
.upload-box{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#fff;padding:8px;border-radius:25px;display:flex;gap:5px;z-index:10}
</style>
</head>
<body>
<div class="header">
<form method="GET" action="/" style="display:flex;flex:1;gap:5px">
<input name="q" placeholder="بحث...">
<button type="submit">بحث</button>
</form>
</div>
<div class="container">
{% for v in videos %}
<div class="reel">
<video src="{{v.url}}" loop autoplay muted playsinline onclick="this.paused?this.play():this.pause()"></video>
<div class="info"><b>{{v.user}}</b><br>{{v.desc}}</div>
<div class="actions">❤️<br><br>💬<br><br>↗️</div>
</div>
{% endfor %}
</div>
<form class="upload-box" method="POST" action="/upload" enctype="multipart/form-data">
<input type="file" name="video" accept="video/*" required style="width:130px">
<input type="text" name="desc" placeholder="وصف" style="width:70px;border-radius:10px;border:1px solid #ccc;padding:5px">
<button type="submit" style="background:#42b72a;color:#fff;border:none;border-radius:15px;padding:5px 10px">رفع</button>
</form>
</body>
</html>
